name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  RUSTUP_TOOLCHAIN: '1.99.1'
  GOTOOLCHAIN: go1.27.1

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch complete workspace dependencies before sharing the cache
        run: cargo fetch --locked
      - id: plan
        run: python3 scripts/ci/plan.py tests

  lint:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Validate workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/release.yml
      - run: cargo fmt --all -- --check
      - name: Clippy (existing warnings remain visible)
        run: cargo clippy --workspace --all-targets --locked
      - name: CI helper regression tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

  test:
    needs: plan
    name: Tests / ${{ matrix.package }} / ${{ matrix.kind }} / ${{ strategy.job-index }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Install the real Rust analyzer test prerequisites
        if: matrix.kind != 'doc' && matrix.package != 'prod-code-protocol'
        run: rustup component add rust-src rust-analyzer
      - name: Cache the pinned Go language server
        if: matrix.kind != 'doc' && matrix.package != 'prod-code-protocol'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/gopls
          key: gopls-${{ runner.os }}-${{ runner.arch }}-0.23.0-go1.27.1
      - name: Provision real-server test prerequisites
        if: matrix.kind != 'doc' && matrix.package != 'prod-code-protocol'
        run: bash scripts/ci/provision-test-tools.sh
      - name: Run existing tests in this shard
        env:
          TEST_SHARD: ${{ toJSON(matrix) }}
        run: python3 scripts/ci/plan.py run-tests

  ci:
    if: always()
    needs: [plan, lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI scope to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          rows = json.loads(os.environ['RESULTS'])
          assert all(row['result'] == 'success' for row in rows.values()), rows
          PY
