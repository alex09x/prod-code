[workspace]
resolver = "2"
members = [
    "crates/prod-code-protocol",
    "crates/prod-code-client",
    "crates/prod-code-gateway",
    "crates/prod-code-engine-rust",
    "crates/prod-code-engine-go",
    "crates/prod-code-engine-generic",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["alex09x <alex@prod.codes>"]
repository = "https://github.com/alex09x/prod-code"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossbeam-channel = "0.5"
lsp-server = "0.7"
lsp-types = "0.97"
tempfile = "3.17"
bytes = "1.10"
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2.5"

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 0

[profile.test]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16



