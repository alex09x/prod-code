<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="client-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cluster-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="card-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="bottom-strip-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Drop Shadows and Glow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Tech Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="260" r="300" fill="#6366f1" opacity="0.09" filter="blur(70px)"/>
  <circle cx="950" cy="280" r="340" fill="#10b981" opacity="0.08" filter="blur(80px)"/>
  <circle cx="600" cy="580" r="260" fill="#06b6d4" opacity="0.08" filter="blur(70px)"/>

  <!-- ==================== HEADER SECTION ==================== -->
  <g transform="translate(50, 32)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="url(#cyan-glow)" filter="url(#drop-shadow)"/>
    <path d="M11 20 L17 26 L29 14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">prod-code</text>
    <text x="185" y="23" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" font-weight="600">v0.3.29 Architecture Overview</text>
    <text x="54" y="42" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13">Distributed Remote Code Intelligence Platform · 67 Tools · 9 Nodes · 355 Cores · Sub-ms LAN Latency</text>
  </g>

  <!-- ==================== COLUMN 1: DEVELOPER WORKSTATION ==================== -->
  <g transform="translate(50, 92)" filter="url(#drop-shadow)">
    <!-- Outer Card -->
    <rect width="440" height="414" rx="14" fill="url(#client-card-grad)" stroke="#4338ca" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect width="440" height="42" rx="14" fill="#1e1b4b" fill-opacity="0.9"/>
    
    <!-- Header Title -->
    <circle cx="22" cy="21" r="6" fill="#818cf8"/>
    <text x="36" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Developer Workstation</text>
    <text x="315" y="26" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">0% CPU Offload</text>

    <!-- Sub-card 1: AI Coding Agents & IDEs -->
    <g transform="translate(16, 54)">
      <rect width="408" height="96" rx="8" fill="url(#card-inner)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">AI CODING AGENTS &amp; IDEs</text>
      
      <!-- Agent Badges -->
      <g transform="translate(16, 34)">
        <rect x="0" y="0" width="118" height="26" rx="5" fill="#0f172a" stroke="#1e293b"/>
        <circle cx="12" cy="13" r="4" fill="#f97316"/>
        <text x="22" y="17" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Claude Code</text>

        <rect x="126" y="0" width="126" height="26" rx="5" fill="#0f172a" stroke="#1e293b"/>
        <circle cx="138" cy="13" r="4" fill="#10b981"/>
        <text x="148" y="17" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">OpenAI Codex</text>

        <rect x="260" y="0" width="118" height="26" rx="5" fill="#0f172a" stroke="#1e293b"/>
        <circle cx="272" cy="13" r="4" fill="#3b82f6"/>
        <text x="282" y="17" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Antigravity</text>
      </g>
      
      <text x="16" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12.5">Native IDE integration: <tspan fill="#cbd5e1" font-weight="600">Zed IDE</tspan> · <tspan fill="#cbd5e1" font-weight="600">VS Code</tspan> · <tspan fill="#cbd5e1" font-weight="600">Neovim</tspan> via stdio bridge</text>
    </g>

    <!-- Sub-card 2: Protocol Bridges -->
    <g transform="translate(16, 162)">
      <rect width="408" height="114" rx="8" fill="url(#card-inner)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">LOCAL CLIENT BRIDGES &amp; PROTOCOLS</text>
      
      <!-- prod-code mcp row -->
      <g transform="translate(16, 34)">
        <rect width="376" height="32" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1.2"/>
        <text x="14" y="21" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">prod-code mcp</text>
        <text x="140" y="20" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">67 Native Tools · Hot Reload · Stdio RPC</text>
      </g>
      
      <!-- prod-code lsp row -->
      <g transform="translate(16, 72)">
        <rect width="376" height="30" rx="6" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1.2"/>
        <text x="14" y="20" fill="#c084fc" font-family="monospace" font-size="13" font-weight="700">prod-code lsp</text>
        <text x="140" y="19" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">LSP Bridge · Diagnostics · Fast Navigation</text>
      </g>
    </g>

    <!-- Sub-card 3: Fast Mirror Engine -->
    <g transform="translate(16, 288)">
      <rect width="408" height="110" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
      <text x="16" y="24" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="700">FAST MIRROR &amp; SYNC ENGINE</text>
      <text x="16" y="48" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• Base64 incremental delta diffs with node watermark caching</text>
      <text x="16" y="68" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• Local stdlib/SDK shadow cache avoids redundant transfers</text>
      <g transform="translate(16, 78)">
        <rect width="376" height="22" rx="4" fill="#1e293b"/>
        <text x="12" y="16" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">Cold Sync: 0.76s (10.8 MB) · Sub-ms Edit Roundtrips</text>
      </g>
    </g>
  </g>

  <!-- ==================== CONNECTOR: 10 GbE MESH ==================== -->
  <g transform="translate(490, 245)">
    <!-- Glowing Conduit Line -->
    <path d="M 0 50 C 60 50, 60 50, 120 50" stroke="url(#cyan-glow)" stroke-width="5" fill="none" filter="url(#neon-glow)"/>
    <path d="M 0 50 C 60 50, 60 50, 120 50" stroke="#ffffff" stroke-width="2" stroke-dasharray="8,5" fill="none"/>
    
    <!-- Central Mesh Badge -->
    <rect x="22" y="0" width="76" height="100" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.8" filter="url(#drop-shadow)"/>
    <text x="60" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">10 GbE</text>
    <text x="60" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">LAN MESH</text>
    <path d="M 32 49 L 88 49" stroke="#334155" stroke-width="1"/>
    <text x="60" y="65" fill="#10b981" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">&lt; 1 ms</text>
    <text x="60" y="78" fill="#64748b" font-family="monospace" font-size="9.5" text-anchor="middle">RTT</text>
    <text x="60" y="92" fill="#f59e0b" font-family="monospace" font-size="9.5" text-anchor="middle">:9400/:9401</text>
  </g>

  <!-- ==================== COLUMN 2: 9-NODE PRODUCTION CLUSTER ==================== -->
  <g transform="translate(610, 92)" filter="url(#drop-shadow)">
    <!-- Outer Card -->
    <rect width="540" height="414" rx="14" fill="url(#cluster-card-grad)" stroke="#059669" stroke-width="1.5" stroke-opacity="0.8"/>
    <rect width="540" height="42" rx="14" fill="#064e3b" fill-opacity="0.9"/>
    
    <!-- Header Title -->
    <circle cx="22" cy="21" r="6" fill="#34d399"/>
    <text x="36" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Production Gateway Cluster Fleet</text>
    <text x="365" y="26" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">9 Nodes · 355 CPU Cores</text>

    <!-- Node Group 1: 128-Core Ampere Altra -->
    <g transform="translate(16, 54)">
      <rect width="508" height="74" rx="8" fill="url(#card-inner)" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="124" height="50" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>
      <text x="24" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Linux aarch64</text>
      <text x="24" y="50" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11.5">128c · Altra</text>
      
      <text x="148" y="30" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Heavy Polyglot Workhorse Node</text>
      <text x="435" y="30" fill="#10b981" font-family="monospace" font-size="11.5" font-weight="700">0.05 load</text>
      <text x="148" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Rust, Go, C++, Python, TS, Java/Kotlin, C#, Scala, Zig, Nim, Dart</text>
    </g>

    <!-- Node Group 2: 192-Core AMD Zen 4/5 -->
    <g transform="translate(16, 136)">
      <rect width="508" height="88" rx="8" fill="url(#card-inner)" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="124" height="64" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
      <text x="24" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Linux x86_64</text>
      <text x="24" y="50" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11.5">192 Cores Total</text>
      <text x="24" y="66" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">6 Nodes × 32c</text>
      
      <text x="148" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Zen 5 &amp; Zen 4 Compilation Fleet</text>
      <text x="435" y="28" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="700">0.10 load</text>
      <text x="148" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">• High-throughput remote compilation &amp; parallel test suites</text>
      <text x="148" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">• Shared Salsa AST DB + Isolated Session Overlays (:9400)</text>
    </g>

    <!-- Node Group 3: Apple Silicon macOS -->
    <g transform="translate(16, 232)">
      <rect width="508" height="74" rx="8" fill="url(#card-inner)" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="124" height="50" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
      <text x="22" y="32" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Apple Silicon</text>
      <text x="22" y="50" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11.5">35c · M-series</text>
      
      <text x="148" y="30" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Dedicated macOS Fleet (Darwin Engine)</text>
      <text x="435" y="30" fill="#c084fc" font-family="monospace" font-size="11.5" font-weight="700">0.18 load</text>
      <text x="148" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Mac Studio 24c + MacBook 11c: SwiftPM, sourcekit-lsp, xcodebuild</text>
    </g>

    <!-- Node Group 4: Gossip & Observability -->
    <g transform="translate(16, 314)">
      <rect width="508" height="88" rx="8" fill="url(#card-inner)" stroke="#334155" stroke-width="1"/>
      <rect x="12" y="12" width="124" height="64" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
      <text x="22" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800">Cluster Mesh</text>
      <text x="22" y="48" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11">UDP Gossip</text>
      <text x="22" y="64" fill="#f59e0b" font-family="monospace" font-size="10.5">:9401 Port</text>

      <text x="148" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Decentralized Routing &amp; Telemetry</text>
      <text x="415" y="28" fill="#f59e0b" font-family="monospace" font-size="11.5" font-weight="700">mesh active</text>
      <text x="148" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">• Rendezvous placement (HRW) with affinity · 5s gossip heartbeat</text>
      <text x="148" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">• Prometheus (:9401/metrics) · VictoriaMetrics &amp; Grafana</text>
    </g>
  </g>

  <!-- ==================== BOTTOM STRIP: GATEWAY INTERNALS ==================== -->
  <g transform="translate(50, 520)" filter="url(#drop-shadow)">
    <rect width="1100" height="135" rx="14" fill="url(#bottom-strip-grad)" stroke="#475569" stroke-width="1.3"/>
    
    <!-- Title Bar -->
    <text x="20" y="24" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" letter-spacing="0.5">GATEWAY ENGINE ARCHITECTURE (PER NODE)</text>
    
    <!-- Pillar 1: Worktree Isolation -->
    <g transform="translate(20, 36)">
      <rect width="340" height="85" rx="7" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
      <text x="16" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Worktree Isolation</text>
      <text x="160" y="21" fill="#64748b" font-family="monospace" font-size="11">&lt;repo&gt;--wt-&lt;hash&gt;</text>
      <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Overlays over shared base Salsa compiler DB</text>
      <text x="16" y="60" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Zero cache bleed · 30m idle evict · 7d prune</text>
      <text x="16" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">SharedWorkspace::with_base memory model</text>
    </g>

    <!-- Pillar 2: Dual-Engine Shadow Validation -->
    <g transform="translate(380, 36)">
      <rect width="340" height="85" rx="7" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>
      <text x="16" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Dual-Engine Shadow Validation</text>
      <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• In-memory /dev/shm evaluation without disk writes</text>
      <text x="16" y="60" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Eliminates 21s crate re-inference delay on queries</text>
      <text x="16" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Refusal gate blocks broken edits · Force overrides</text>
    </g>

    <!-- Pillar 3: Remote Execution -->
    <g transform="translate(740, 36)">
      <rect width="340" height="85" rx="7" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="16" y="22" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Remote Build &amp; Test Matrix</text>
      <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Parallel cargo / go / pytest / ctest execution</text>
      <text x="16" y="60" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Warm target/ and package cache on fast NVMe</text>
      <text x="16" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">code_check / test / exec with structured dossiers</text>
    </g>
  </g>
</svg>
