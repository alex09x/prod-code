[package]
name = "prod-code-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "prod_code_gateway"
path = "src/lib.rs"

[[bin]]
name = "prod-code-server"
path = "src/main.rs"

[dependencies]
prod-code-protocol = { path = "../prod-code-protocol" }
prod-code-engine-rust = { path = "../prod-code-engine-rust" }
prod-code-engine-go = { path = "../prod-code-engine-go" }
prod-code-engine-generic = { path = "../prod-code-engine-generic" }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
serde.workspace = true
rapidfire = "0.2"
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc = "0.2"
# Dense intent search (roadmap 8.4): a sentence-embedding model run in process. The model file
# itself is optional and lives outside the repository.
ort = { version = "2.0.0-rc.10", features = ["ndarray"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = "0.17"

[dev-dependencies]
tempfile.workspace = true
# The client side, so the live test drives the gateway the way an agent does. No cycle: the
# MCP crate knows nothing about the gateway.
prod-code-mcp = { path = "../prod-code-mcp" }
libc = "0.2"


