[package]
name = "prod-code-mcp"
description = "Native Model Context Protocol (MCP) server for prod-code AI agent fleets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
prod-code-protocol = { path = "../prod-code-protocol" }
tokio = { workspace = true }
notify = "8"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
url = { workspace = true }
ignore = "0.4.30"
regex = "1"
similar = "2"
# Reads Cargo manifests for a crate's edition (#441).
toml = "0.9"
# Cargo workspace members use the same glob syntax as Cargo itself.
glob = "0.3.3"
# Rust identifiers use Unicode XID boundaries, including combining marks (#484).
unicode-ident = "1.0.22"
# Reuse the locked URL stack's normalizer for Rust's NFC identifier identity.
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
libc = "0.2"
# Use the engine's already locked Rust parser for exact expression ancestry.
ra_ap_syntax = { git = "https://github.com/alex09x/rust-analyzer", rev = "3abd2c9f653a27e8c1b19195b1582634a6fe86e1", package = "syntax" }
# The lexer that parser already locks: extraction matches copies on Rust's own tokens (#1438).
ra-ap-rustc_lexer = "=0.166.0"
# Parse JavaScript/TypeScript with a real parser for delegate initializer boundaries (#1335).
oxc_allocator = "=0.146.0"
oxc_ast = "=0.146.0"
oxc_parser = "=0.146.0"
oxc_semantic = { version = "=0.146.0", default-features = false }
oxc_span = "=0.146.0"

[dev-dependencies]
tempfile = { workspace = true }
prod-code-testkit = { path = "../prod-code-testkit" }
