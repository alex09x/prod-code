[package]
name = "prod-code-mcp"
description = "Native Model Context Protocol (MCP) server for prod-code AI agent fleets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
prod-code-protocol = { path = "../prod-code-protocol" }
tokio = { workspace = true }
notify = "8"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
url = { workspace = true }
ignore = "0.4.30"
similar = "2"
# Reads Cargo manifests for a crate's edition (#441).
toml = "0.9"
# Rust identifiers use Unicode XID boundaries, including combining marks (#484).
unicode-ident = "1.0.22"

[dev-dependencies]
tempfile = { workspace = true }
prod-code-testkit = { path = "../prod-code-testkit" }
