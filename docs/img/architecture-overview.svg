<text x='680' y='361' fill='#6a737d' font-size='11'>developer laptop offload</text>
<text x='28' y='388' fill='#6a737d' font-size='11'>Workspaces synchronize over 10 GbE LAN using incremental Base64 diffs rather than slow network mounts (NFS/SSHFS). Each git</text><text x='28' y='404' fill='#6a737d' font-size='11'>worktree attaches an isolated session overlay (&lt;repo&gt;--wt-&lt;hash&gt;) to a shared base compiler database</text><text x='28' y='420' fill='#6a737d' font-size='11'>(SharedWorkspace::with_base) with zero cross-session cache contamination. Edits are pre-checked on a dedicated RAM-disk</text><text x='28' y='436' fill='#6a737d' font-size='11'>shadow engine before disk writes. The cluster gossip mesh auto-routes requests to the quietest capable node, steering Apple</text><text x='28' y='452' fill='#6a737d' font-size='11'>Swift workloads to macOS Apple Silicon nodes and polyglot builds to high-throughput 128-core Linux nodes.</text>
</svg>