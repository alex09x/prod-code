</defs>
<rect width='960' height='460' fill='white'/>
<text x='16' y='24' font-size='15' font-weight='bold' fill='#1f2328'>Production cluster: 9 nodes, 355 cores, language-aware routing</text>
<text x='16' y='42' fill='#6a737d'>Decentralized UDP gossip (:9401) · Automatic node placement · Specialized Darwin routing</text>
<rect x='16' y='56' width='250' height='250' rx='10' fill='#f6f8fa' stroke='#d0d7de'/><text x='28' y='76' fill='#1f2328' font-weight='bold' font-size='13'>client dispatch</text>
<rect x='30' y='90' width='222' height='44' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='141.0' y='110.0' text-anchor='middle' fill='#1f2328' font-size='11' font-weight='bold'>client request</text><text x='141.0' y='124.0' text-anchor='middle' fill='#6a737d' font-size='9.5'>code_check / test / def / slice</text>
<rect x='30' y='146' width='222' height='54' rx='6' fill='#f3e8ff' stroke='#6f42c1' stroke-width='1.5'/><text x='141.0' y='165.0' text-anchor='middle' fill='#1f2328' font-size='11' font-weight='bold'>rendezvous placement</text><text x='141.0' y='178.0' text-anchor='middle' fill='#6a737d' font-size='9'>highest-random-weight ordering</text><text x='141.0' y='190.0' text-anchor='middle' fill='#6a737d' font-size='9'>remembers placement locally</text>
<rect x='30' y='212' width='222' height='44' rx='6' fill='#e8efff' stroke='#1d4ed8' stroke-width='1.5'/><text x='141.0' y='226.0' text-anchor='middle' fill='#1f2328' font-size='11' font-weight='bold'>nested path router</text><text x='141.0' y='239.0' text-anchor='middle' fill='#6a737d' font-size='9'>e.g. path: 'swift/Package.swift'</text><text x='141.0' y='251.0' text-anchor='middle' fill='#6a737d' font-size='9'>routes to Swift-capable node</text>
<line x1='266' y1='173' x2='310' y2='173' stroke='#1d4ed8' stroke-width='1.5' marker-end='url(#n)'/><text x='288.0' y='166' text-anchor='middle' fill='#1d4ed8' font-size='11'>RPC route</text>
<rect x='310' y='56' width='634' height='250' rx='10' fill='#f6f8fa' stroke='#d0d7de'/><text x='322' y='76' fill='#1f2328' font-weight='bold' font-size='13'>9-node cluster fleet (355 CPU cores total)</text>
<rect x='324' y='86' width='290' height='50' rx='6' fill='#fdecea' stroke='#c0392b' stroke-width='1.5'/><text x='469.0' y='103.0' text-anchor='middle' fill='#1f2328' font-size='11' font-weight='bold'>128c Linux aarch64 (Ampere Altra)</text><text x='469.0' y='116.0' text-anchor='middle' fill='#6a737d' font-size='9'>Heavy Polyglot: Rust, Go, C++, Python</text><text x='469.0' y='128.0' text-anchor='middle' fill='#6a737d' font-size='9'>load: 0.05/cpu · 10GbE LAN</text>
<rect x='624' y='86' width='306' height='50' rx='6' fill='#e8efff' stroke='#1d4ed8' stroke-width='1.5'/><text x='777.0' y='103.0' text-anchor='middle' fill='#1f2328' font-size='11' font-weight='bold'>192c Linux x86_64 (Zen 5 &amp; Zen 4)</text><text x='777.0' y='116.0' text-anchor='middle' fill='#6a737d' font-size='9'>6 Nodes × 32 Cores · NVMe storage &amp; RAM</text><text x='777.0' y='128.0' text-anchor='middle' fill='#6a737d' font-size='9'>High-throughput compilation &amp; parallel tests</text>
<rect x='324' y='146' width='290' height='50' rx='6' fill='#f3e8ff' stroke='#6f42c1' stroke-width='1.5'/><text x='469.0' y='163.0' text-anchor='middle' fill='#1f2328' font-size='11' font-weight='bold'>35c macOS Apple Silicon (M-series)</text><text x='469.0' y='176.0' text-anchor='middle' fill='#6a737d' font-size='9'>Mac Studio (24c) + MacBook Pro (11c)</text><text x='469.0' y='188.0' text-anchor='middle' fill='#6a737d' font-size='9'>Dedicated: Swift, sourcekit-lsp, xcodebuild</text>
<rect x='624' y='146' width='306' height='50' rx='6' fill='#fef3c7' stroke='#b45309' stroke-width='1.5'/><text x='777.0' y='163.0' text-anchor='middle' fill='#1f2328' font-size='11' font-weight='bold'>decentralized UDP gossip (:9401)</text><text x='777.0' y='176.0' text-anchor='middle' fill='#6a737d' font-size='9'>heartbeats every 5s · load, memory, status</text><text x='777.0' y='188.0' text-anchor='middle' fill='#6a737d' font-size='9'>zero master SPOF · instant failover</text>
<rect x='324' y='206' width='606' height='44' rx='6' fill='white' stroke='#d0d7de' stroke-width='1.5'/><text x='627.0' y='226.0' text-anchor='middle' fill='#1f2328' font-size='10' font-weight='normal'>observability: Prometheus (:9401/metrics) · Pushgateway (:9091) · VictoriaMetrics &amp; Grafana</text><text x='627.0' y='240.0' text-anchor='middle' fill='#6a737d' font-size='9.5'>Events logged to events-YYYY-MM-DD.jsonl · p50/p95 latency audit via `prod-code metrics`</text>
<text x='627' y='278' text-anchor='middle' fill='#6a737d' font-size='10'>Sequential cluster binary rollout via scripts/cluster-rollout.py</text>
<text x='28' y='335' fill='#1f2328' font-weight='bold' font-size='14'>128 cores</text>
<text x='28' y='351' fill='#6a737d' font-size='11'>Ampere Altra aarch64</text>
<text x='250' y='335' fill='#1f2328' font-weight='bold' font-size='14'>192 cores</text>
<text x='250' y='351' fill='#6a737d' font-size='11'>AMD Zen 4/5 x86_64</text>
<text x='480' y='335' fill='#1f2328' font-weight='bold' font-size='14'>35 cores</text>
<text x='480' y='351' fill='#6a737d' font-size='11'>Apple Silicon Darwin</text>
<text x='710' y='335' fill='#1f2328' font-weight='bold' font-size='14'>5 seconds</text>
<text x='710' y='351' fill='#6a737d' font-size='11'>decentralized gossip interval</text>
<text x='28' y='380' fill='#6a737d' font-size='11'>Gateways broadcast UDP status packets every 5 seconds. Workspaces are assigned using rendezvous ordering (highest-random-</text><text x='28' y='396' fill='#6a737d' font-size='11'>weight) with stickiness so warm compilation caches stay resident. If a request targets a nested SwiftPM package inside a Rust</text><text x='28' y='412' fill='#6a737d' font-size='11'>repo, the placement engine automatically reroutes that specific execution to an Apple Silicon macOS node without disrupting</text><text x='28' y='428' fill='#6a737d' font-size='11'>primary workspace placement.</text>
</svg>